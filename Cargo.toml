[package]
name = "libstrophe-vendored"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
description = "Vendored libstrophe C library with FFI bindings and rustls TLS backend"
license = "MIT"
links = "strophe_vendored"

[dependencies]
# TLS backend dependencies
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", optional = true }
x509-parser = { version = "0.16", optional = true }
sha2 = { version = "0.10", optional = true }
libc = "0.2"

# WebSocket dependencies
smol = { version = "2.0", optional = true }
async-tungstenite = { version = "0.28", features = ["tokio-rustls-native-certs"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
futures-rustls = { version = "0.26", optional = true }
async-channel = { version = "2.3", optional = true }
base64 = { version = "0.22", optional = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
# For integration tests
# complex example: safe setsockopt (TCP keepalive / user timeout)
socket2 = { version = "0.6", features = ["all"] }
# For async WebSocket tests
smol-macros = "0.1"

[features]
default = ["libstrophe-0_14", "tls-rustls"]
buildtime_bindgen = ["bindgen"]
tls-rustls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types", "dep:x509-parser", "dep:sha2"]
websocket = ["dep:smol", "dep:async-tungstenite", "dep:futures-util", "dep:futures-rustls", "dep:async-channel", "dep:base64"]
libstrophe-0_9_3 = []
libstrophe-0_10_0 = ["libstrophe-0_9_3"]
libstrophe-0_11_0 = ["libstrophe-0_10_0"]
libstrophe-0_12_0 = ["libstrophe-0_11_0"]
libstrophe-0_13 = ["libstrophe-0_12_0"]
libstrophe-0_14 = ["libstrophe-0_13"]

[build-dependencies.bindgen]
version = "0.73"
optional = true
